name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests cancel their own stale runs. Pushes to the same ref serialize
  # instead, so a forced update never cuts a publish off halfway through, and
  # GitHub keeps only the newest pending run for the group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check version
        id: version
        run: |
          version=$(awk -F'"' '/^const version = /{print $2; exit}' internal/landrop/cli.go)
          test -n "$version" || { echo "const version not found in internal/landrop/cli.go"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match const version $version in internal/landrop/cli.go." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Build binaries
        run: node scripts/build.mjs --release

      - name: Test
        run: go test ./...

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: landrop-binaries
          path: dist/landrop-*
          if-no-files-found: error

  nightly:
    name: Nightly
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: nightly
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: landrop-binaries
          path: dist

      - name: Create release if needed
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Nightly" \
              --notes "Rolling build of main."
          fi

      - name: Update nightly
        run: |
          gh release upload "$TAG" dist/landrop-* --clobber
          gh release edit "$TAG" --notes "Built from main at $GITHUB_SHA (v$VERSION)."
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

  release:
    name: Release ${{ github.ref_name }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: landrop-binaries
          path: dist

      - name: Publish release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/landrop-* --clobber --repo "$GITHUB_REPOSITORY"
